plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.vn.security.core'
version = '0.0.4-SNAPSHOT'
description = 'security-core'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

// Starter là library, không phải executable app
bootJar { enabled = false }
jar     { enabled = true; archiveClassifier = '' }

repositories {
    mavenCentral()
}

dependencies {
    // Web + Security
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.aspectj:aspectjweaver'

    // JWT
    api 'org.springframework.security:spring-security-oauth2-resource-server'
    api 'org.springframework.security:spring-security-oauth2-jose'
    api 'org.springframework.security:spring-security-data'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core:4.29.2'

    // Hazelcast Cache
    implementation 'com.hazelcast:hazelcast-spring:5.5.0'
    implementation 'com.hazelcast:hazelcast-hibernate53:5.2.0'

    // MapStruct
    api 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Jackson
    implementation 'tools.jackson.datatype:jackson-datatype-hibernate7'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'

    // Metrics
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // Commons
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.hibernate.validator:hibernate-validator'

    // Auto-configuration metadata
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('javadoc', Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Spring Boot Security Core Starter'
                description = 'Reusable Spring Boot starter providing JWT authentication, RBAC, auditing, fetch plans and security utilities.'
                url = 'https://github.com/NhanhAnhXtanh/spring-boot-security-core-starter'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'NhanhAnhXtanh'
                        name = 'NhanhAnhXtanh'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/NhanhAnhXtanh/spring-boot-security-core-starter.git'
                    developerConnection = 'scm:git:ssh://git@github.com/NhanhAnhXtanh/spring-boot-security-core-starter.git'
                    url = 'https://github.com/NhanhAnhXtanh/spring-boot-security-core-starter'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/NhanhAnhXtanh/spring-boot-security-core-starter')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
