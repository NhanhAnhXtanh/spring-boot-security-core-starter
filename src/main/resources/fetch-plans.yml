fetch-plans:
  - entity: com.vn.security.core.domain.ProofOrganization
    name: proof-organization-list
    properties:
      - id
      - code
      - name
      - ownerLogin

  - entity: com.vn.security.core.domain.ProofOrganization
    name: proof-organization-detail
    extends: proof-organization-list
    properties:
      - budget
      - name: departments
        properties:
          - id
          - code
          - name
          - costCenter
          - name: employees
            properties:
              - id
              - employeeNumber
              - firstName
              - lastName
              - email
              - salary

  - entity: com.vn.security.core.domain.ProofDepartment
    name: proof-department-list
    properties:
      - id
      - code
      - name
      - name: organization
        properties:
          - id
          - name
      - costCenter

  - entity: com.vn.security.core.domain.ProofDepartment
    name: proof-department-detail
    extends: proof-department-list
    properties:
      - name: organization
        properties:
          - id
          - code
          - name
          - ownerLogin
      - name: employees
        properties:
          - id
          - employeeNumber
          - firstName
          - lastName
          - email
          - salary

  - entity: com.vn.security.core.domain.ProofEmployee
    name: proof-employee-list
    properties:
      - id
      - employeeNumber
      - firstName
      - lastName
      - name: department
        properties:
          - id
          - name
      - email

  - entity: com.vn.security.core.domain.ProofEmployee
    name: proof-employee-detail
    extends: proof-employee-list
    properties:
      - salary
      - name: department
        properties:
          - id
          - code
          - name
